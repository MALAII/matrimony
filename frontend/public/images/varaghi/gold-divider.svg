  <!-- Left horizontal accent rule reaching the left edge of 'VARAGHI' -->
  <line x1="2" y1="7" x2="102" y2="7" stroke="url(#varaghiGoldGrad)" stroke-width="1.3" stroke-linecap="round" />
  
